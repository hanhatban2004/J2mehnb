name: Import site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download and unzip site
        run: |
          set -e
          curl -sS -f -L -o /tmp/site.zip "https://files.catbox.moe/0q0gwv.zip"
          rm -rf import && mkdir import
          cd import
          unzip -q /tmp/site.zip
          echo "unzipped files: $(find . -type f | wc -l)"
      - name: Sync into repo
        run: |
          set -ex
          cp -a import/. .
          rm -rf import
          find . -maxdepth 1 -type d | head -30
          git config user.name "hanhatban2004"
          git config user.email "hanhatban2004@users.noreply.github.com"
          git add -A
          git status --short | head -20
          git commit -m "Import full J2ME web site (no CheerpJ)" || echo "nothing to commit"
          git push 2>&1
